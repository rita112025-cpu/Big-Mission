name: Generate dependency locks
on:
  push:
    paths:
      - '.github/workflows/dependency-lock.yml'
      - 'backend/requirements.txt'
      - 'frontend/package.json'
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Python in clean venv
        run: |
          python -m venv .lock-venv
          .lock-venv/bin/python -m pip install -r backend/requirements.txt
          .lock-venv/bin/python -m pip freeze > backend/requirements-lock.txt
      - name: Resolve frontend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements-lock.txt frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Python and npm dependencies"
            git push origin HEAD:main
          fi
